<!DOCTYPE html>
<html lang="ar" dir="rtl" data-lang="ar" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Al-Hady Dashboard</title>
    <!-- Apply theme + lang before render to prevent flash -->
    <script>
      (function () {
        var theme = localStorage.getItem('alhady_theme') || 'dark';
        var lang  = localStorage.getItem('alhady_lang')  || 'ar';
        var html  = document.documentElement;
        html.dataset.theme = theme;
        html.lang          = lang;
        html.dir           = lang === 'ar' ? 'rtl' : 'ltr';
        html.dataset.lang  = lang;
      })();
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-textMain min-h-screen flex overflow-hidden">

    <!-- Login Screen -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-background flex flex-col items-center justify-center p-4">
      <div class="glass-panel p-8 w-full max-w-md">
        <div class="text-center mb-8">
          <h1 class="text-3xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">Al-Hady</h1>
          <p class="text-textMuted mt-2"><span data-i18n="Sign in to access dashboard">Sign in to access dashboard</span></p>
        </div>
        <form id="login-form" class="space-y-4">
          <div id="login-error" class="hidden bg-red-500/20 text-red-400 p-3 rounded-lg text-sm mb-4"></div>
          <div>
            <label class="block text-sm font-medium text-textMuted mb-1">
              <span data-i18n="Email">Email</span>
            </label>
            <input type="email" id="login-email" required
              class="w-full bg-surface border border-border rounded-lg px-4 py-2 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-textMain">
          </div>
          <div>
            <label class="block text-sm font-medium text-textMuted mb-1">
              <span data-i18n="Password">Password</span>
            </label>
            <input type="password" id="login-password" required
              class="w-full bg-surface border border-border rounded-lg px-4 py-2 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-textMain">
          </div>
          <button type="submit" id="login-btn"
            class="w-full bg-primary hover:bg-primary/90 text-white font-medium py-2 px-4 rounded-lg transition-colors flex justify-center items-center">
            <span data-i18n="Sign In">Sign In</span>
          </button>
        </form>
      </div>
    </div>

    <!-- Sidebar -->
    <aside class="w-64 bg-surface border-e border-border hidden md:flex flex-col h-screen transition-all duration-300 z-20 absolute md:relative" id="sidebar">
      <div class="p-6 flex items-center justify-between border-b border-border">
        <h1 class="text-xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
          Al-Hady
        </h1>
        <button id="close-sidebar" class="md:hidden text-textMuted hover:text-textMain">
          <i class="ph ph-x text-xl"></i>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="nav-menu">
        <a href="#tools" class="nav-item active" data-page="tools">
          <i class="ph ph-wrench text-xl me-3"></i><span data-i18n="Tools">Tools</span>
        </a>
        <a href="#clients" class="nav-item" data-page="clients">
          <i class="ph ph-users-three text-xl me-3"></i><span data-i18n="Clients">Clients</span>
        </a>
        <a href="#partners" class="nav-item" data-page="partners">
          <i class="ph ph-handshake text-xl me-3"></i><span data-i18n="Partners">Partners</span>
        </a>
        <a href="#team" class="nav-item" data-page="team">
          <i class="ph ph-users text-xl me-3"></i><span data-i18n="Team">Team</span>
        </a>
        <a href="#projects" class="nav-item" data-page="projects">
          <i class="ph ph-folder-open text-xl me-3"></i><span data-i18n="Projects">Projects</span>
        </a>
        <a href="#portfolio" class="nav-item" data-page="portfolio">
          <i class="ph ph-image text-xl me-3"></i><span data-i18n="Portfolio">Portfolio</span>
        </a>
        <a href="#reviews" class="nav-item" data-page="reviews">
          <i class="ph ph-star text-xl me-3"></i><span data-i18n="Reviews">Reviews</span>
        </a>
        <a href="#jobs" class="nav-item" data-page="jobs">
          <i class="ph ph-briefcase text-xl me-3"></i><span data-i18n="Jobs">Jobs</span>
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <i class="ph ph-gear text-xl me-3"></i><span data-i18n="Settings">Settings</span>
        </a>
      </nav>

      <div class="p-4 border-t border-border">
        <button id="logout-btn" class="w-full flex items-center px-4 py-2 text-textMuted hover:text-textMain hover:bg-red-500/10 rounded-lg transition-colors">
          <i class="ph ph-sign-out text-xl me-3"></i>
          <span data-i18n="Sign Out">Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden min-w-0">
      <!-- Topbar -->
      <header class="h-16 bg-surface/50 backdrop-blur-md border-b border-border flex items-center justify-between px-6 z-10 sticky top-0">
        <div class="flex items-center gap-3">
          <button id="mobile-menu-btn" class="md:hidden text-textMuted hover:text-textMain">
            <i class="ph ph-list text-2xl"></i>
          </button>
          <div class="relative hidden sm:block">
            <i class="ph ph-magnifying-glass absolute start-3 top-1/2 -translate-y-1/2 text-textMuted"></i>
            <input type="text" id="search-input" data-i18n-placeholder="Search..."
              placeholder="Search..."
              class="bg-background border border-border rounded-lg ps-10 pe-4 py-2 text-sm focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-64 transition-all text-textMain">
          </div>
        </div>

        <div class="flex items-center gap-3">
          <!-- Theme toggle -->
          <button id="theme-toggle-btn" title="Toggle theme"
            class="text-textMuted hover:text-textMain transition-colors p-1.5 rounded-lg hover:bg-primary/10">
            <i id="theme-icon" class="ph ph-sun text-xl"></i>
          </button>

          <!-- Language toggle -->
          <button id="lang-toggle-btn" title="Toggle language"
            class="text-textMuted hover:text-textMain transition-colors text-sm font-bold px-2.5 py-1 rounded-lg border border-border hover:border-primary/60 hover:bg-primary/10">
            <span id="lang-indicator">EN</span>
          </button>

          <!-- Notifications -->
          <button class="relative text-textMuted hover:text-textMain transition-colors">
            <i class="ph ph-bell text-xl"></i>
            <span class="absolute -top-1 -end-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-surface"></span>
          </button>

          <!-- Avatar -->
          <div class="h-8 w-8 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-sm font-semibold cursor-pointer text-white">
            AD
          </div>
        </div>
      </header>

      <!-- Main Scrollable Area -->
      <main class="flex-1 overflow-y-auto p-6 md:p-8" id="main-content">
        <!-- Content injected by main.js -->
      </main>
    </div>

    <!-- Overlay for mobile sidebar -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-10 hidden md:hidden backdrop-blur-sm transition-opacity opacity-0"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
